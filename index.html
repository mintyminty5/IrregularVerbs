<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>불규칙 동사 DM 챌린지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nanum Gothic', sans-serif; background-color: #f0f4f8; overflow: hidden; touch-action: manipulation; }
        .jua-font { font-family: 'Jua', sans-serif; }
        .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: 18px; position: relative; font-size: 0.95rem; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .message-anim { animation: slideUp 0.25s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Speed Game Styles */
        .block-selected { 
            background-color: #fbbf24 !important; 
            border-color: #d97706 !important; 
            color: #451a03 !important;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
            z-index: 10;
        }
        
        .pang-effect {
            position: absolute;
            pointer-events: none;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #4ade80 0%, transparent 70%);
            border-radius: 50%;
            transform: scale(0);
            animation: pang-anim 0.5s ease-out forwards;
        }
        @keyframes pang-anim {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        .block-correct { animation: correct-explode 0.4s ease-out forwards; pointer-events: none; }
        @keyframes correct-explode { 
            0% { transform: scale(1.1); opacity: 1; filter: brightness(1.5); }
            100% { transform: scale(0); opacity: 0; }
        }

        .shake { animation: shake 0.3s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .combo-bounce { animation: combo-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes combo-pop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1.2); }
        }

        /* Custom Toast Animation */
        .toast-enter { animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .toast-leave { animation: toastOut 0.3s ease-in forwards; }
        @keyframes toastIn { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes toastOut { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -20px); opacity: 0; } }
    </style>
    
    <!-- Firebase 실시간 데이터베이스 연동 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            
            // 전역에서 사용할 수 있게 윈도우 객체에 바인딩
            window.firebaseDb = db;
            window.firebaseAuth = auth;
            window.appId = appId;
            window.doc = doc;
            window.setDoc = setDoc;
            window.collection = collection;
            window.onSnapshot = onSnapshot;

            // 앱 실행 시 익명 인증 자동 처리
            async function initAuth() {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch(e) {
                    console.error("Auth failed", e);
                }
            }
            initAuth();
        } catch(e) {
            console.error("Firebase init failed", e);
        }
    </script>
</head>
<body class="h-screen w-full flex items-center justify-center">

    <div id="app-container" class="relative w-full h-full max-w-md bg-white shadow-2xl flex flex-col overflow-hidden sm:rounded-[32px]">
        
        <!-- Header -->
        <header class="bg-[#7c94b6] text-white p-4 flex items-center justify-between z-20">
            <div class="flex items-center gap-3">
                <button onclick="handleHeaderBack()" class="text-xl w-8 h-8 flex items-center justify-center hover:bg-white/20 rounded-full transition-colors">◀</button>
                <div>
                    <h1 class="jua-font text-lg leading-tight">영단어 고수들 모임</h1>
                    <p class="text-[10px] opacity-90 flex items-center gap-1">실시간 참여 중 🟢</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleLeaderboard()" class="bg-white/20 p-2 rounded-lg text-xs hover:bg-white/30" title="명예의 전당">🏆</button>
                <button onclick="toggleVocabWizard()" class="bg-white/20 p-2 rounded-lg text-xs hover:bg-white/30" title="단어장 관리">📚</button>
                <button onclick="toggleAdmin()" class="bg-white/20 p-2 rounded-lg text-xs hover:bg-white/30" title="게임 설정">⚙️</button>
                <div class="bg-black/10 px-3 py-1 rounded-lg min-w-[60px]">
                    <p class="text-[9px] opacity-70 uppercase font-bold text-center">점수</p>
                    <p id="score-display" class="text-lg font-bold jua-font leading-none text-yellow-300 text-center">0</p>
                </div>
            </div>
        </header>

        <main class="flex-1 flex flex-col overflow-hidden relative bg-[#abc1d1]">
            
            <div id="leaderboard-layer" class="absolute inset-0 bg-white z-[80] hidden flex flex-col">
                <div class="bg-yellow-400 text-black p-4 flex justify-between items-center shadow-md">
                    <h2 class="text-xl font-bold jua-font flex items-center gap-2"><span>🏆</span> 명예의 전당</h2>
                    <button onclick="toggleLeaderboard()" class="bg-black/10 w-8 h-8 rounded-full font-bold">X</button>
                </div>
                
                <div class="flex gap-2 p-3 bg-yellow-50 text-sm font-bold justify-center border-b border-yellow-200">
                    <button onclick="changeLeaderboardTab('passive')" id="tab-passive" class="px-3 py-1 rounded-full bg-yellow-400 text-black shadow-sm">수동태 집중</button>
                    <button onclick="changeLeaderboardTab('all')" id="tab-all" class="px-3 py-1 rounded-full text-slate-500 hover:bg-yellow-100">전체 무작위</button>
                    <button onclick="changeLeaderboardTab('speed')" id="tab-speed" class="px-3 py-1 rounded-full text-slate-500 hover:bg-yellow-100">스피드 팡</button>
                </div>

                <div class="flex-1 overflow-y-auto p-4 bg-slate-50">
                    <div id="leaderboard-list" class="space-y-2">
                        <!-- Data injected here -->
                    </div>
                </div>
            </div>

            <div id="vocab-layer" class="absolute inset-0 bg-white z-[70] hidden flex flex-col">
                <div class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md">
                    <h2 class="text-xl font-bold jua-font flex items-center gap-2"><span>🪄</span> 나만의 단어 마법사</h2>
                    <button onclick="toggleVocabWizard()" class="bg-white/20 w-8 h-8 rounded-full font-bold">X</button>
                </div>
                
                <!-- Add New Word Form -->
                <div class="p-4 bg-indigo-50 border-b border-indigo-100">
                    <p class="text-xs font-bold text-indigo-800 mb-2">새로운 불규칙 동사 추가하기</p>
                    <form id="add-verb-form" onsubmit="addCustomVerb(event)" class="space-y-2">
                        <input type="text" id="new-v1" placeholder="동사원형 (예: go (가다))" class="w-full p-3 rounded-xl border border-indigo-200 text-sm focus:outline-indigo-500" required>
                        <div class="flex gap-2">
                            <input type="text" id="new-v2" placeholder="과거형 (went)" class="w-1/2 p-3 rounded-xl border border-indigo-200 text-sm focus:outline-indigo-500" required>
                            <input type="text" id="new-v3" placeholder="과거분사형 (gone)" class="w-1/2 p-3 rounded-xl border border-indigo-200 text-sm focus:outline-indigo-500" required>
                        </div>
                        <div class="flex items-center justify-between mt-2 pl-1">
                            <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                                <input type="checkbox" id="new-isPassive" class="w-4 h-4 accent-indigo-600" checked>
                                수동태 집중/스피드 게임에 포함
                            </label>
                            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-bold text-sm shadow-md active:scale-95 transition-transform">추가</button>
                        </div>
                    </form>
                </div>

                <!-- Word List -->
                <div class="flex-1 overflow-y-auto p-4 bg-slate-50">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-sm font-bold text-slate-600">현재 저장된 단어 (<span id="vocab-count">0</span>)</span>
                        <button onclick="resetToDefaultVerbs()" class="text-[10px] bg-slate-200 text-slate-600 px-2 py-1 rounded-md hover:bg-slate-300">기본 단어로 초기화</button>
                    </div>
                    <div id="vocab-list" class="space-y-2 pb-10">
                        <!-- Words will be injected here -->
                    </div>
                </div>
            </div>

            <div id="admin-layer" class="absolute inset-0 bg-black/80 z-[60] hidden flex flex-col items-center justify-center p-8 text-white">
                <h2 class="text-xl font-bold jua-font mb-6 text-yellow-400">스피드 게임 설정</h2>
                <div class="w-full space-y-6">
                    <div>
                        <label class="block text-sm mb-2 font-bold">⏱️ 스피드팡 제한 시간 (초)</label>
                        <input type="range" id="time-setter" min="10" max="120" step="10" value="30" class="w-full accent-yellow-400" oninput="updateTimeText(this.value)">
                        <div class="text-center mt-1 text-yellow-300 font-bold"><span id="time-val">30</span>초</div>
                    </div>
                    <div>
                        <label class="block text-sm mb-2 font-bold">🔥 오답 시 감점 시간 (초)</label>
                        <select id="penalty-setter" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-600">
                            <option value="1">1초 (쉬움)</option>
                            <option value="2" selected>2초 (보통)</option>
                            <option value="3">3초 (매움)</option>
                            <option value="5">5초 (핵매움)</option>
                        </select>
                    </div>
                    <button onclick="toggleAdmin()" class="w-full py-4 bg-yellow-400 text-black rounded-2xl font-bold">설정 완료</button>
                </div>
            </div>

            <div id="login-layer" class="absolute inset-0 bg-white z-[50] flex flex-col items-center justify-center p-8 text-center">
                <div class="text-6xl mb-4 animate-bounce">🔥</div>
                <h2 class="text-2xl font-bold jua-font mb-2 text-slate-800">불규칙 동사 마스터</h2>
                <p class="text-slate-400 text-sm mb-6 italic">함께 연습하고 단어 고수가 되어보자!</p>
                <input type="text" id="user-name" placeholder="이름을 입력해봐!" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-center text-lg focus:border-indigo-400 outline-none mb-4">
                <button onclick="enterApp()" class="w-full py-4 bg-[#fee500] text-[#3c1e1e] rounded-2xl font-bold shadow-md">단톡방 입장</button>
            </div>

            <div id="level-layer" class="absolute inset-0 bg-white z-[40] hidden flex flex-col p-6 overflow-y-auto">
                <h2 class="text-xl font-bold jua-font text-center mb-6">챌린지 모드 선택</h2>
                <div class="space-y-4">
                    <button onclick="startQuiz('passive')" class="w-full p-5 bg-gradient-to-r from-indigo-600 to-blue-500 text-white rounded-2xl text-left shadow-md flex justify-between items-center group active:scale-95 transition-transform">
                        <div>
                            <span class="text-2xl block mb-1">🛡️</span>
                            <span class="font-bold block text-lg">수동태 집중 공략</span>
                            <span class="text-[10px] opacity-80">과거분사(V3) 변형을 완벽하게</span>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] font-bold opacity-60">BEST</p>
                            <p id="best-passive" class="jua-font text-xl text-yellow-300">0</p>
                        </div>
                    </button>
                    <button onclick="startQuiz('all')" class="w-full p-5 bg-gradient-to-r from-teal-500 to-emerald-500 text-white rounded-2xl text-left shadow-md flex justify-between items-center group active:scale-95 transition-transform">
                        <div>
                            <span class="text-2xl block mb-1">🌍</span>
                            <span class="font-bold block text-lg">전체 무작위 챌린지</span>
                            <span class="text-[10px] opacity-80">저장된 모든 동사 등장</span>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] font-bold opacity-60">BEST</p>
                            <p id="best-all" class="jua-font text-xl text-yellow-300">0</p>
                        </div>
                    </button>
                    <button onclick="startSpeedGame()" class="w-full p-5 bg-gradient-to-r from-pink-500 to-rose-400 text-white rounded-2xl text-left shadow-md relative overflow-hidden flex justify-between items-center group active:scale-95 transition-transform">
                        <div>
                            <span class="text-2xl block mb-1">⚡</span>
                            <span class="font-bold block text-lg">스피드 블록 팡</span>
                            <span class="text-[10px] opacity-80">시간 내에 짝을 맞추기</span>
                        </div>
                        <div class="text-right pr-2">
                            <p class="text-[9px] font-bold opacity-60">BEST</p>
                            <p id="best-speed" class="jua-font text-xl text-yellow-300">0</p>
                        </div>
                    </button>
                </div>
            </div>

            <div id="speed-layer" class="absolute inset-0 bg-indigo-900 z-[30] hidden flex flex-col text-white">
                <div class="p-4 flex justify-between items-center bg-black/20">
                    <div class="flex items-center gap-2">
                        <span class="text-xs opacity-70">TIME</span>
                        <span id="speed-timer" class="font-bold text-xl text-yellow-300">30.0</span>
                    </div>
                    <div id="speed-combo-text" class="jua-font text-pink-400 text-2xl opacity-0 transition-all scale-50">0 COMBO!</div>
                </div>
                <div class="flex-1 flex flex-col items-center justify-center p-4 relative" id="game-canvas">
                    <div id="speed-question-box" class="w-full p-6 bg-white/10 backdrop-blur-md rounded-2xl border border-white/20 text-center mb-6 shadow-xl">
                        <h3 id="speed-target-q" class="text-3xl font-bold jua-font text-white tracking-tight">-</h3>
                        <p class="text-[10px] text-indigo-300 mt-2 uppercase tracking-widest font-bold">Touch: V2 → V3</p>
                    </div>
                    <div id="speed-options" class="grid grid-cols-3 gap-3 w-full content-center"></div>
                    
                    <button onclick="exitToLevel()" class="mt-8 px-6 py-2 bg-white/10 rounded-full text-xs font-bold border border-white/20 hover:bg-white/20 transition-all">그만하고 나가기</button>
                </div>
            </div>

            <div id="chat-box" class="h-[65%] overflow-y-auto p-4 space-y-4 no-scrollbar pb-6"></div>

            <div id="input-area" class="flex-1 p-4 bg-white border-t border-slate-200">
                <form id="quiz-form" onsubmit="handleAnswer(event)"></form>
            </div>
        </main>
        
        <!-- Global Toast Container -->
        <div id="toast-container" class="absolute top-16 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center pointer-events-none"></div>
    </div>

    <script>
        // 기본 제공 동사 목록
        const DEFAULT_VERBS = [
            { q: "break (부수다)", v2: "broke", v3: "broken", isPassive: true },
            { q: "speak (말하다)", v2: "spoke", v3: "spoken", isPassive: true },
            { q: "write (쓰다)", v2: "wrote", v3: "written", isPassive: true },
            { q: "make (만들다)", v2: "made", v3: "made", isPassive: true },
            { q: "build (짓다)", v2: "built", v3: "built", isPassive: true },
            { q: "send (보내다)", v2: "sent", v3: "sent", isPassive: true },
            { q: "give (주다)", v2: "gave", v3: "given", isPassive: true },
            { q: "take (타다/가져가다)", v2: "took", v3: "taken", isPassive: true },
            { q: "find (발견하다)", v2: "found", v3: "found", isPassive: true },
            { q: "know (알다)", v2: "knew", v3: "known", isPassive: true },
            { q: "tell (말하다)", v2: "told", v3: "told", isPassive: true },
            { q: "see (보다)", v2: "saw", v3: "seen", isPassive: true },
            { q: "read (읽다)", v2: "read", v3: "read", isPassive: true },
            { q: "do (하다)", v2: "did", v3: "done", isPassive: true },
            { q: "eat (먹다)", v2: "ate", v3: "eaten", isPassive: true },
            { q: "buy (사다)", v2: "bought", v3: "bought", isPassive: false },
            { q: "go (가다)", v2: "went", v3: "gone", isPassive: false },
            { q: "run (달리다)", v2: "ran", v3: "run", isPassive: false },
            { q: "come (오다)", v2: "came", v3: "come", isPassive: false }
        ];

        let appVerbs = []; // 앱에서 실제로 사용하는 단어 배열
        let userName = "";
        let quizList = [];
        let currentIdx = 0;
        let score = 0;
        
        // Speed Game Variables
        let speedTimer = 30;
        let speedInterval = null;
        let speedCombo = 0;
        let speedStep = 0; 
        let lastVerbQ = ""; 
        let configTime = 30;
        let configPenalty = 2;
        let currentMode = ""; // 'passive', 'all', 'speed'

        function showToast(message, type = 'normal') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-800 text-white';
            if (type === 'error') bgClass = 'bg-red-500 text-white';
            if (type === 'success') bgClass = 'bg-green-500 text-white';
            
            toast.className = `${bgClass} px-4 py-2 rounded-full shadow-lg text-sm font-bold toast-enter mb-2 whitespace-nowrap`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-leave');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function loadAppVerbs() {
            const saved = localStorage.getItem('custom_verbs');
            if (saved) {
                try {
                    appVerbs = JSON.parse(saved);
                } catch(e) {
                    appVerbs = [...DEFAULT_VERBS];
                }
            } else {
                appVerbs = [...DEFAULT_VERBS];
            }
        }

        function saveAppVerbs() {
            localStorage.setItem('custom_verbs', JSON.stringify(appVerbs));
        }

        function toggleVocabWizard() {
            const layer = document.getElementById('vocab-layer');
            if (layer.classList.contains('hidden')) {
                layer.classList.remove('hidden');
                renderVocabList();
            } else {
                layer.classList.add('hidden');
            }
        }

        function renderVocabList() {
            const list = document.getElementById('vocab-list');
            document.getElementById('vocab-count').textContent = appVerbs.length;
            list.innerHTML = '';
            
            appVerbs.forEach((verb, index) => {
                const div = document.createElement('div');
                div.className = "bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center";
                div.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-slate-800 truncate">${verb.q}</span>
                            ${verb.isPassive ? '<span class="text-[8px] bg-indigo-100 text-indigo-600 px-1.5 py-0.5 rounded">수동/스피드</span>' : ''}
                        </div>
                        <div class="text-xs text-slate-500 font-mono">
                            V2: <span class="text-indigo-500 font-bold">${verb.v2}</span> / 
                            V3: <span class="text-pink-500 font-bold">${verb.v3}</span>
                        </div>
                    </div>
                    <button onclick="deleteVerb(${index})" class="ml-2 w-8 h-8 flex items-center justify-center bg-red-50 text-red-500 rounded-lg shrink-0 hover:bg-red-100 transition-colors">🗑️</button>
                `;
                list.appendChild(div);
            });
        }

        function addCustomVerb(e) {
            e.preventDefault();
            const q = document.getElementById('new-v1').value.trim();
            const v2 = document.getElementById('new-v2').value.trim().toLowerCase();
            const v3 = document.getElementById('new-v3').value.trim().toLowerCase();
            const isPassive = document.getElementById('new-isPassive').checked;

            if (!q || !v2 || !v3) {
                showToast("모든 칸을 채워주세요!", "error");
                return;
            }

            appVerbs.unshift({ q, v2, v3, isPassive }); // Add to top
            saveAppVerbs();
            renderVocabList();
            
            // Reset form
            document.getElementById('new-v1').value = '';
            document.getElementById('new-v2').value = '';
            document.getElementById('new-v3').value = '';
            
            showToast("새 단어가 마법사 책에 추가되었습니다!", "success");
        }

        function deleteVerb(index) {
            appVerbs.splice(index, 1);
            saveAppVerbs();
            renderVocabList();
            showToast("단어가 삭제되었습니다.");
        }

        function resetToDefaultVerbs() {
            appVerbs = [...DEFAULT_VERBS];
            saveAppVerbs();
            renderVocabList();
            showToast("기본 단어로 초기화되었습니다.", "success");
        }

        function loadBestScores() {
            document.getElementById('best-passive').textContent = localStorage.getItem('best_passive') || 0;
            document.getElementById('best-all').textContent = localStorage.getItem('best_all') || 0;
            document.getElementById('best-speed').textContent = localStorage.getItem('best_speed') || 0;
        }

        function updateBestScore(mode, newScore) {
            const key = `best_${mode}`;
            const oldBest = parseInt(localStorage.getItem(key) || 0);
            if (newScore > oldBest) {
                localStorage.setItem(key, newScore);
                
                // 최고 점수 갱신 시 실시간 DB에 저장
                if (window.firebaseAuth && window.firebaseAuth.currentUser) {
                    const userId = window.firebaseAuth.currentUser.uid;
                    const ref = window.doc(window.firebaseDb, 'artifacts', window.appId, 'public', 'data', `leaderboard_${mode}`, userId);
                    window.setDoc(ref, {
                        userId: userId,
                        userName: userName || "익명",
                        score: newScore,
                        timestamp: Date.now()
                    }).catch(e => console.error("Failed to save score:", e));
                }
                
                return true; 
            }
            return false;
        }

        function toggleAdmin() {
            const layer = document.getElementById('admin-layer');
            layer.classList.toggle('hidden');
        }

        function updateTimeText(val) {
            document.getElementById('time-val').textContent = val;
            configTime = parseInt(val);
        }

        function enterApp() {
            userName = document.getElementById('user-name').value.trim() || "익명";
            document.getElementById('login-layer').classList.add('hidden');
            document.getElementById('level-layer').classList.remove('hidden');
            loadBestScores();
            loadAppVerbs(); // Load custom verbs when entering
        }

        function handleHeaderBack() {
            if (!document.getElementById('leaderboard-layer').classList.contains('hidden')) {
                toggleLeaderboard();
            } else if (!document.getElementById('vocab-layer').classList.contains('hidden')) {
                toggleVocabWizard();
            } else if (!document.getElementById('speed-layer').classList.contains('hidden')) {
                exitToLevel();
            } else if (currentMode === 'passive' || currentMode === 'all') {
                exitToLevel();
            } else if (!document.getElementById('level-layer').classList.contains('hidden')) {
                document.getElementById('level-layer').classList.add('hidden');
                document.getElementById('login-layer').classList.remove('hidden');
            } else {
                location.reload();
            }
        }

        function exitToLevel() {
            if (speedInterval) clearInterval(speedInterval);
            
            document.getElementById('speed-layer').classList.add('hidden');
            document.getElementById('level-layer').classList.remove('hidden');
            
            document.getElementById('chat-box').innerHTML = "";
            document.getElementById('quiz-form').innerHTML = "";
            document.getElementById('score-display').textContent = "0";
            
            currentMode = "";
            score = 0;
            currentIdx = 0;
            
            loadBestScores();
        }

        function addMessage(sender, text, icon, color, isUser = false) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `flex w-full message-anim ${isUser ? 'justify-end' : 'justify-start'}`;
            if (isUser) {
                div.innerHTML = `<div class="chat-bubble bg-[#fee500] text-black font-bold">${text}</div>`;
            } else {
                div.innerHTML = `<div class="w-8 h-8 rounded-full ${color} flex items-center justify-center text-sm mr-2 shrink-0 shadow-sm">${icon}</div>
                    <div class="flex flex-col"><span class="text-[10px] text-slate-500 mb-0.5 ml-1">${sender}</span><div class="chat-bubble bg-white text-slate-800">${text}</div></div>`;
            }
            box.appendChild(div);
            box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
        }

        function startQuiz(mode) {
            currentMode = mode;
            let pool = mode === 'passive' ? appVerbs.filter(v => v.isPassive) : [...appVerbs];
            
            if (pool.length < 3) {
                showToast(`단어가 너무 적습니다! 최소 3개가 필요해요. (현재 ${pool.length}개)`, "error");
                return;
            }

            document.getElementById('level-layer').classList.add('hidden');
            quizList = pool.sort(() => Math.random() - 0.5);
            currentIdx = 0;
            score = 0;
            document.getElementById('score-display').textContent = score;
            
            addMessage("지아", `오! ${userName} 등판했네? 단어장 데이터로 문제 나간다!`, "🧚", "bg-pink-100");
            setTimeout(renderQuestion, 1000);
        }

        function renderQuestion() {
            if (currentIdx >= quizList.length) {
                const isNewRecord = updateBestScore(currentMode, score);
                const recordTxt = isNewRecord ? `<span class="text-yellow-400">🆕 신기록 달성!</span>` : `최고 점수: ${localStorage.getItem('best_' + currentMode)}`;
                
                addMessage("도윤", `와 ${userName} 진짜 쩔었다. 올클리어 ㄷㄷ <br> ${recordTxt}`, "⚽", "bg-blue-100");
                document.getElementById('quiz-form').innerHTML = `<button type="button" onclick="exitToLevel()" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold shadow-lg">모드 선택으로 가기</button>`;
                return;
            }
            const item = quizList[currentIdx];
            document.getElementById('quiz-form').innerHTML = `
                <div class="bg-indigo-50 p-4 rounded-2xl border-2 border-indigo-100 text-center mb-3">
                    <p class="text-[10px] text-indigo-400 font-bold mb-1 uppercase tracking-wider italic">Challenge ${currentIdx + 1}/${quizList.length}</p>
                    <h3 class="font-bold text-xl text-slate-800">${item.q}</h3>
                </div>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <input type="text" id="v2-in" placeholder="과거형" class="p-4 bg-slate-50 border border-slate-200 rounded-xl text-center focus:outline-indigo-400 text-lg font-mono" autocomplete="off" required>
                    <input type="text" id="v3-in" placeholder="과거분사형" class="p-4 bg-slate-50 border border-slate-200 rounded-xl text-center focus:outline-indigo-400 text-lg font-mono" autocomplete="off" required>
                </div>
                <button type="submit" class="w-full py-4 bg-[#fee500] text-[#3c1e1e] font-bold rounded-xl shadow-md active:translate-y-1 transition-all">정답 전송</button>
            `;
            const input = document.getElementById('v2-in');
            if(input) input.focus();
        }

        function handleAnswer(e) {
            e.preventDefault();
            const v2 = document.getElementById('v2-in').value.trim().toLowerCase();
            const v3 = document.getElementById('v3-in').value.trim().toLowerCase();
            const item = quizList[currentIdx];

            addMessage(userName, `${v2}, ${v3}!`, null, null, true);

            setTimeout(() => {
                if (v2 === item.v2 && v3 === item.v3) {
                    score += 10;
                    document.getElementById('score-display').textContent = score;
                    addMessage("민수", `오~ ${userName} 좀 하는데? 정답이다!`, "🦖", "bg-orange-100");
                    currentIdx++;
                    setTimeout(renderQuestion, 1200);
                } else {
                    addMessage("지아", `앗.. 아깝다! 다시 한 번만 생각해봐! (힌트: V2 시작철자 '${item.v2.charAt(0)}')`, "🧚", "bg-pink-100");
                    document.getElementById('v2-in').value = "";
                    document.getElementById('v3-in').value = "";
                    document.getElementById('v2-in').focus();
                }
            }, 800);
        }

        function startSpeedGame() {
            const pool = appVerbs.filter(v => v.isPassive);
            if (pool.length < 4) {
                showToast(`단어가 부족합니다! 수동태/스피드용 단어가 최소 4개 필요해요. (현재 ${pool.length}개)`, "error");
                return;
            }

            currentMode = 'speed';
            document.getElementById('level-layer').classList.add('hidden');
            document.getElementById('speed-layer').classList.remove('hidden');
            
            configPenalty = parseInt(document.getElementById('penalty-setter').value);
            score = 0; 
            speedTimer = configTime; 
            speedCombo = 0; 
            speedStep = 0;
            document.getElementById('score-display').textContent = score;
            
            nextSpeedQ();
            speedInterval = setInterval(() => {
                speedTimer -= 0.1;
                if (speedTimer < 0) speedTimer = 0;
                document.getElementById('speed-timer').textContent = speedTimer.toFixed(1);
                if (speedTimer <= 0) {
                    clearInterval(speedInterval);
                    showSpeedResult();
                }
            }, 100);
        }

        function createPang(x, y) {
            const pang = document.createElement('div');
            pang.className = 'pang-effect';
            pang.style.left = (x - 50) + 'px';
            pang.style.top = (y - 50) + 'px';
            document.getElementById('game-canvas').appendChild(pang);
            setTimeout(() => pang.remove(), 500);
        }

        function showSpeedResult() {
            const finalScore = score;
            const isNewRecord = updateBestScore('speed', finalScore);
            
            document.getElementById('speed-options').innerHTML = `
                <div class="col-span-3 text-center space-y-4 py-8 bg-black/40 rounded-3xl backdrop-blur-md">
                    <p class="text-3xl font-bold jua-font text-white">TIME OVER!</p>
                    <div class="py-4">
                        <p class="text-sm opacity-70">나의 최종 점수</p>
                        <p class="text-6xl font-bold text-yellow-400 jua-font drop-shadow-lg">${finalScore}</p>
                        ${isNewRecord ? '<p class="text-xl font-bold text-pink-400 mt-2 animate-bounce">NEW RECORD! 🔥</p>' : `<p class="text-xs opacity-50 mt-2">최고 기록: ${localStorage.getItem('best_speed')}</p>`}
                    </div>
                    <button onclick="exitToLevel()" class="w-48 py-4 bg-white text-indigo-900 font-bold rounded-2xl shadow-xl active:scale-95 transition-all">메인으로</button>
                </div>
            `;
            document.getElementById('speed-target-q').textContent = "수고하셨습니다!";
        }

        let speedTarget = null;
        let selV2 = null;

        function nextSpeedQ() {
            speedStep = 0;
            selV2 = null;
            
            const pool = appVerbs.filter(v => v.isPassive);
            // 같은 단어가 연속으로 나오지 않도록 필터링 (풀이 충분할 때만)
            let availablePool = pool.filter(v => v.q !== lastVerbQ);
            if (availablePool.length === 0) availablePool = pool;
            
            speedTarget = availablePool[Math.floor(Math.random() * availablePool.length)];
            lastVerbQ = speedTarget.q;

            document.getElementById('speed-target-q').textContent = speedTarget.q;
            
            let options = [
                { text: speedTarget.v2, type: 'v2' },
                { text: speedTarget.v3, type: 'v3' }
            ];

            // 남은 칸(7개)을 오답으로 채우기
            let attempts = 0;
            while(options.length < 9 && attempts < 100) {
                const r = appVerbs[Math.floor(Math.random() * appVerbs.length)];
                const text = Math.random() > 0.5 ? r.v2 : r.v3;
                
                // 중복 텍스트가 없으면 추가
                if (!options.some(o => o.text === text)) {
                    options.push({ text: text, type: 'wrong' });
                }
                attempts++;
            }
            
            // 만약 고유 단어가 부족해서 9개를 못 채웠을 경우 빈칸 처리나 임시 문자열 삽입
            let dummyId = 1;
            while(options.length < 9) {
                options.push({ text: "dummy" + dummyId++, type: 'wrong' });
            }

            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('speed-options');
            container.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "h-16 bg-white/10 rounded-2xl font-bold font-mono border border-white/10 shadow-lg text-lg transition-all active:scale-90 hover:bg-white/20 flex items-center justify-center";
                btn.textContent = opt.text.startsWith('dummy') ? '-' : opt.text;
                
                if (opt.text.startsWith('dummy')) {
                    btn.disabled = true;
                    btn.classList.add('opacity-30');
                } else {
                    btn.onclick = (e) => handleSpeedClick(e, btn, opt);
                }
                
                container.appendChild(btn);
            });
        }

        function handleSpeedClick(e, btn, opt) {
            if (speedStep === 0 && opt.text === speedTarget.v2) {
                btn.classList.add('block-selected');
                selV2 = btn;
                speedStep = 1;
            } else if (speedStep === 1 && opt.text === speedTarget.v3) {
                btn.classList.add('block-correct');
                if(selV2) selV2.classList.add('block-correct');
                
                createPang(e.clientX || e.pageX, e.clientY || e.pageY);
                
                score += 20;
                speedCombo++;
                updateCombo();
                document.getElementById('score-display').textContent = score;
                setTimeout(nextSpeedQ, 300);
            } else {
                // 틀렸을 때
                speedCombo = 0;
                updateCombo();
                speedTimer -= configPenalty; 
                btn.classList.add('shake');
                btn.style.backgroundColor = "rgba(239, 68, 68, 0.7)";
                
                // V2 선택 상태 리셋 (선택적UX: 틀렸을때 V2부터 다시 고르게 할 것인지)
                if(selV2) {
                    selV2.classList.remove('block-selected');
                    selV2 = null;
                    speedStep = 0;
                }

                setTimeout(() => {
                    btn.classList.remove('shake');
                    btn.style.backgroundColor = "";
                }, 300);
            }
        }

        function updateCombo() {
            const comboEl = document.getElementById('speed-combo-text');
            if (speedCombo >= 2) {
                comboEl.textContent = `${speedCombo} COMBO! 🔥`;
                comboEl.classList.remove('opacity-0', 'scale-50');
                comboEl.classList.add('combo-bounce', 'scale-100');
                setTimeout(() => comboEl.classList.remove('combo-bounce'), 300);
            } else {
                comboEl.classList.add('opacity-0', 'scale-50');
                comboEl.classList.remove('scale-100');
            }
        }
        
        // --- Leaderboard System ---
        let currentLeaderboardTab = 'passive';
        let leaderboardUnsubscribe = null;

        function toggleLeaderboard() {
            const layer = document.getElementById('leaderboard-layer');
            if (layer.classList.contains('hidden')) {
                layer.classList.remove('hidden');
                changeLeaderboardTab(currentLeaderboardTab);
            } else {
                layer.classList.add('hidden');
                if (leaderboardUnsubscribe) {
                    leaderboardUnsubscribe();
                    leaderboardUnsubscribe = null;
                }
            }
        }

        function changeLeaderboardTab(tab) {
            currentLeaderboardTab = tab;
            
            // 탭 스타일 변경
            ['passive', 'all', 'speed'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "px-3 py-1 rounded-full bg-yellow-400 text-black shadow-sm transition-all";
                } else {
                    btn.className = "px-3 py-1 rounded-full text-slate-500 hover:bg-yellow-100 transition-all";
                }
            });

            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '<div class="text-center text-slate-400 text-sm py-10 font-bold">순위를 불러오는 중... ⏳</div>';

            if (leaderboardUnsubscribe) {
                leaderboardUnsubscribe();
                leaderboardUnsubscribe = null;
            }

            // 권한 체크
            if (!window.firebaseDb || !window.firebaseAuth || !window.firebaseAuth.currentUser) {
                listEl.innerHTML = '<div class="text-center text-red-400 text-sm py-10 font-bold">서버 연결이 원활하지 않습니다.<br>잠시 후 다시 시도해주세요.</div>';
                return;
            }

            const ref = window.collection(window.firebaseDb, 'artifacts', window.appId, 'public', 'data', `leaderboard_${tab}`);
            
            // 실시간 순위 리스너 연결
            leaderboardUnsubscribe = window.onSnapshot(ref, (snapshot) => {
                let data = [];
                snapshot.forEach(doc => {
                    data.push(doc.data());
                });

                // 높은 점수 순으로 정렬
                data.sort((a, b) => b.score - a.score);

                if (data.length === 0) {
                    listEl.innerHTML = '<div class="text-center text-slate-400 text-sm py-10 font-bold">아직 등록된 기록이 없습니다.<br>첫 번째 챔피언이 되어보세요!</div>';
                    return;
                }

                listEl.innerHTML = '';
                data.forEach((item, index) => {
                    let rankBadge = `<span class="w-6 text-center inline-block">${index + 1}</span>`;
                    if (index === 0) rankBadge = '🥇';
                    else if (index === 1) rankBadge = '🥈';
                    else if (index === 2) rankBadge = '🥉';

                    const isMe = item.userId === window.firebaseAuth.currentUser.uid;
                    const bgClass = isMe ? 'bg-yellow-100 border-yellow-300' : 'bg-white border-slate-200';

                    listEl.innerHTML += `
                        <div class="${bgClass} p-3 rounded-xl border flex justify-between items-center shadow-sm mb-2 message-anim" style="animation-delay: ${index * 0.05}s">
                            <div class="flex items-center gap-3">
                                <span class="font-bold jua-font flex items-center justify-center ${index < 3 ? 'text-yellow-600 text-2xl' : 'text-slate-500 text-lg'} w-8">${rankBadge}</span>
                                <span class="font-bold text-slate-800">${item.userName} ${isMe ? '<span class="text-[10px] bg-yellow-400 text-black px-1 rounded ml-1 align-middle">나</span>' : ''}</span>
                            </div>
                            <div class="jua-font text-xl text-indigo-600">${item.score}점</div>
                        </div>
                    `;
                });
            }, (error) => {
                console.error("Leaderboard fetch error", error);
                listEl.innerHTML = '<div class="text-center text-red-400 text-sm py-10">데이터를 불러오는데 실패했습니다.</div>';
            });
        }
        
        // 페이지 로드 시 초기 데이터 세팅
        window.onload = () => {
            loadAppVerbs();
        }
    </script>
</body>
</html>
